name: Compilar APK

# Rode manualmente pela aba "Actions" do GitHub (botão "Run workflow").
# Também roda automaticamente a cada envio de código para a branch main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK de depuração (instalável direto)
        run: gradle assembleDebug
        working-directory: .

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: acompanhamento-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
